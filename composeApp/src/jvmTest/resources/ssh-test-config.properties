# SSH集成测试配置
# 从 ~/.ssh/config 读取的配置

# SSH服务器配置
ssh.host=example.com
ssh.user=testuser
ssh.port=22
ssh.host.alias=myserver

# 测试超时设置（毫秒）
test.command.timeout=5000
test.connection.timeout=10000

# 测试选项
test.skip.if.not.installed=true
test.cleanup.after.run=true

# 需要测试的工具列表
tools.required=nano,vim,less
tools.optional=htop,yazi,tmux,git

# 测试临时目录
test.temp.dir=/tmp/terminal_integration_test

